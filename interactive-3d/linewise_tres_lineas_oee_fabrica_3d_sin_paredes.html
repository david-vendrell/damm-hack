<script>
(function(){
  const P = window.__LINEWISE_PLAN__ || null;

  const STAGES=[
    {key:'cip',  name:'CIP Station',             type:'tanks'},
    {key:'rin',  name:'Rinser',                  type:'rinser'},
    {key:'fill', name:'Can filling & seamer',    type:'filler'},
    {key:'cod',  name:'Codification',            type:'coder'},
    {key:'pas',  name:'Tunnel Pasteurization',   type:'tunnel'},
    {key:'lev',  name:'Fill/level Inspection',   type:'gantry'},
    {key:'vac',  name:'Vacuum Inspection',       type:'gantry'},
    {key:'pak',  name:'Packaging',               type:'pack'},
    {key:'ctn',  name:'Carton & plastic Formats',type:'cartons'},
    {key:'pal',  name:'Palletizer',              type:'pallet'},
    {key:'wrp',  name:'Pallet Wrap',             type:'wrap'}
  ];
  const FAIL={cip:'Válvula de dosificación',rin:'Atasco de latas',fill:'Microfugas en el cierre',pas:'Deriva de temperatura',cod:'Cabezal de tinta seco',vac:'Falsos rechazos',lev:'Calibración de sensor',pak:'Rotura de film',ctn:'Plegado de cartón',pal:'Brazo desalineado',wrp:'Tensión de film'};

  // Build LINES — geometry baseline only; live OEE comes from the plan blocks.
  const DEFAULTS={L14:{oee:0.7,formats:['50cl','33cl']},L17:{oee:0.7,formats:['33cl']},L19:{oee:0.7,formats:['50cl','33cl','44cl']}};
  const Z_BY_LINE={L14:-13,L17:0,L19:13};
  const LINES=Object.keys(DEFAULTS).map(id=>({
    id, z:Z_BY_LINE[id], oee:DEFAULTS[id].oee, baseOee:DEFAULTS[id].oee,
    formats:DEFAULTS[id].formats
  }));

  const X0=-24.5,DX=4.9;

  // ─── Three setup ──────────────────────────────────────────────────────────
  const holder=document.getElementById('canvas-holder');
  const W=()=>holder.clientWidth||680,H=()=>holder.clientHeight||640;
  const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x070c16,0.012);
  const camera=new THREE.PerspectiveCamera(48,W()/H(),0.1,400);
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
  renderer.setClearColor(0x05080f,1);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(W(),H());
  renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.35;
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFShadowMap;
  renderer.physicallyCorrectLights=true;
  holder.appendChild(renderer.domElement);
  scene.background=new THREE.Color(0x14191f); // dark, HDRI used for IBL only

  // Post-processing: bloom only. SSAO and FXAA dropped for perf — renderer already has antialias.
  let composer=null, ssaoPass=null, bloomPass=null, fxaaPass=null;
  if(THREE.EffectComposer && THREE.UnrealBloomPass){
    composer=new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene,camera));
    bloomPass=new THREE.UnrealBloomPass(new THREE.Vector2(W()*0.5,H()*0.5),0.25,0.32,0.85);
    composer.addPass(bloomPass);
  }

  // Key + rim lights; HDRI handles fill via scene.environment (loaded async).
  const sun=new THREE.DirectionalLight(0xfff1d4,3.4);sun.position.set(18,30,14);
  sun.castShadow=true; sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left=-28; sun.shadow.camera.right=28;
  sun.shadow.camera.top=20; sun.shadow.camera.bottom=-20;
  sun.shadow.camera.near=4; sun.shadow.camera.far=60;
  sun.shadow.bias=-0.0005; sun.shadow.normalBias=0.04;
  scene.add(sun);
  const rim=new THREE.DirectionalLight(0x9ccff5,1.1); rim.position.set(-22,16,-10); scene.add(rim);
  // Permanent ambient sweetener so dark corners don't crush to black
  const ambient_fill=new THREE.AmbientLight(0xb0c4dc, 0.6); scene.add(ambient_fill);
  // Hemisphere light for sky/ground fill
  scene.add(new THREE.HemisphereLight(0xc7d8e8, 0x35404c, 0.55));
  const boot_ambient=ambient_fill; // alias so bootScene's existing removal noops

  // Overhead practical lights — paired with the ceiling tubes for plausible illumination
  for(let i=-3;i<=3;i+=2){
    const pl=new THREE.PointLight(0xfff0d8, 4.2, 38, 1.4);
    pl.position.set(0, 14.6, i*7);
    scene.add(pl);
  }
  // Side fill point-lights along the long walls (cool fill so metals read 3D)
  [-22, 22].forEach(x=>{
    for(let z=-18; z<=18; z+=12){
      const pl=new THREE.PointLight(0xb5d8ff, 1.8, 26, 1.6);
      pl.position.set(x, 7, z);
      scene.add(pl);
    }
  });
  // Warm accent spots aimed at each end of the factory floor (depth + mood)
  function accentSpot(x,z,tx,tz, color, intensity){
    const s=new THREE.SpotLight(color, intensity, 34, Math.PI*0.38, 0.55, 1.2);
    s.position.set(x, 10, z); s.target.position.set(tx, 0, tz);
    scene.add(s); scene.add(s.target);
  }
  accentSpot(-30, 0, -14, 0, 0xffb070, 26);   // warm sodium-ish from left
  accentSpot( 30, 0,  14, 0, 0xffd09a, 22);   // warm fill from right
  accentSpot(  0, 8, 0, -13, 0xc5e0ff, 16);   // cool-blue accent on L14
  accentSpot(  0, 8, 0,  13, 0xc5e0ff, 16);   // cool-blue accent on L19

  // ─── Asset loader (HDRI + PBR textures) ───────────────────────────────────
  const assets={textures:{}, env:null};
  const manager=new THREE.LoadingManager();
  const _lbar=document.getElementById('lw-loading-bar');
  const _ldet=document.getElementById('lw-loading-detail');
  manager.onProgress=(url,loaded,total)=>{
    const pct=total?(loaded/total*100):0;
    if(_lbar)_lbar.style.width=pct.toFixed(1)+'%';
    if(_ldet)_ldet.textContent=loaded+' / '+total;
  };
  manager.onError=(url)=>{console.warn('[lw] asset load failed', url);};

  const ASSET_BASE='assets/';
  const texLoader=new THREE.TextureLoader(manager);
  function ldSRGB(p){const t=texLoader.load(ASSET_BASE+p); t.encoding=THREE.sRGBEncoding; t.anisotropy=8; return t;}
  function ldLinear(p){const t=texLoader.load(ASSET_BASE+p); t.anisotropy=8; return t;}

  assets.textures.concrete={
    map:        ldSRGB ('textures/concrete_floor/concrete_floor_03_diff_1k.jpg'),
    normalMap:  ldLinear('textures/concrete_floor/concrete_floor_03_nor_gl_1k.jpg'),
    roughnessMap:ldLinear('textures/concrete_floor/concrete_floor_03_rough_1k.jpg'),
    aoMap:      ldLinear('textures/concrete_floor/concrete_floor_03_ao_1k.jpg'),
  };
  assets.textures.painted={
    map:        ldSRGB ('textures/painted_metal/painted_metal_shutter_diff_1k.jpg'),
    normalMap:  ldLinear('textures/painted_metal/painted_metal_shutter_nor_gl_1k.jpg'),
    roughnessMap:ldLinear('textures/painted_metal/painted_metal_shutter_rough_1k.jpg'),
  };
  assets.textures.steel={
    map:        ldSRGB ('textures/brushed_steel/metal_plate_diff_1k.jpg'),
    normalMap:  ldLinear('textures/brushed_steel/metal_plate_nor_gl_1k.jpg'),
    roughnessMap:ldLinear('textures/brushed_steel/metal_plate_rough_1k.jpg'),
  };

  if(THREE.RGBELoader){
    new THREE.RGBELoader(manager).load(ASSET_BASE+'hdri/industrial_workshop_foundry_2k.hdr', tex=>{
      const pmrem=new THREE.PMREMGenerator(renderer); pmrem.compileEquirectangularShader();
      const envMap=pmrem.fromEquirectangular(tex).texture;
      scene.environment=envMap;
      assets.env=envMap;
      tex.dispose(); pmrem.dispose();
    });
  }

  function box(w,h,d,m){return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);}
  function cyl(a,b,h,m,s){return new THREE.Mesh(new THREE.CylinderGeometry(a,b,h,s||20),m);}
  const mBody=new THREE.MeshStandardMaterial({color:0xc0c8d2,metalness:0.55,roughness:0.55});
  const mDark=new THREE.MeshStandardMaterial({color:0x3e4654,metalness:0.55,roughness:0.55,envMapIntensity:0.7});
  const mSteel=new THREE.MeshStandardMaterial({color:0xd6dde6,metalness:0.92,roughness:0.22});
  const mBlue=new THREE.MeshStandardMaterial({color:0x3b4a6b,metalness:0.55,roughness:0.45});
  const mBelt=new THREE.MeshStandardMaterial({color:0x141c29,metalness:0.2,roughness:0.85});
  const mGlass = new THREE.MeshStandardMaterial({color:0xb8d5ea,metalness:0.3,roughness:0.08,transparent:true,opacity:0.55});

  const SHX=64,SHZ=46;
  const floorMat=new THREE.MeshStandardMaterial({color:0x4a5260,metalness:0.05,roughness:0.85});
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(SHX,SHZ),floorMat);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
  // Floor overlay swapped in by onLoad to use PBR + reflector
  for(let i=-2;i<=2;i++){const lane=box(SHX,0.02,0.18,new THREE.MeshStandardMaterial({color:0xb89800,roughness:0.75,metalness:0.05}));lane.position.set(0,0.022,i*6.5+ (i>0?2.5:i<0?-2.5:0));lane.receiveShadow=true;scene.add(lane);}
  const beamMat=new THREE.MeshStandardMaterial({color:0x2c3a4d,metalness:0.6,roughness:0.55});
  for(let i=-3;i<=3;i++){const tr=box(SHX,0.5,0.5,beamMat);tr.position.set(0,15.6,i*7);scene.add(tr);}
  // Ceiling tube lights: subtle emissive, with a paired RectAreaLight for plausible illumination
  for(let i=-3;i<=3;i++){
    const lt=box(8,0.18,0.5,new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xfff8e8,emissiveIntensity:1.4,roughness:0.5}));
    lt.position.set(0,15.2,i*7);scene.add(lt);
  }

  function tanks(){const g=new THREE.Group();const b=box(4,0.3,2.2,mDark);b.position.y=0.15;g.add(b);for(let i=-1;i<=1;i++){const t=cyl(0.7,0.7,3,mSteel);t.position.set(i*1.2,1.7,0);g.add(t);const c=new THREE.Mesh(new THREE.SphereGeometry(0.7,16,10,0,6.3,0,1.57),mSteel);c.position.set(i*1.2,3.2,0);g.add(c);}g.userData={w:4.4,d:2.4,top:3.6};return g;}
  function rinser(){const g=new THREE.Group();const c=box(1.7,1.8,1.5,mBody);c.position.y=0.9;g.add(c);const sw=cyl(0.7,0.7,0.25,mSteel);sw.position.y=1.95;g.add(sw);const p=box(0.5,0.7,0.05,mGlass);p.position.set(0,1,0.78);g.add(p);g.userData={w:2,d:1.7,top:2.1};return g;}
  function filler(){const g=new THREE.Group();const b=cyl(2,2.1,0.5,mDark);b.position.y=0.25;g.add(b);const car=cyl(1.85,1.85,1.5,mBody);car.position.y=1.25;g.add(car);const tp=cyl(1.95,1.95,0.22,mDark);tp.position.y=2.1;g.add(tp);for(let i=0;i<14;i++){const a=i/14*6.283;const h=cyl(0.07,0.07,0.85,mSteel);h.position.set(Math.cos(a)*1.55,2.55,Math.sin(a)*1.55);g.add(h);}const cap=cyl(0.9,1,0.3,mDark);cap.position.y=3;g.add(cap);g.userData={w:4,d:2.6,top:3.2};return g;}
  function tunnel(){const g=new THREE.Group();const b=box(7,1.5,1.9,mBody);b.position.y=0.85;g.add(b);const r=cyl(0.95,0.95,7,mDark,18);r.rotation.z=1.5708;r.position.y=1.6;g.add(r);for(let i=-2.6;i<=2.6;i+=0.65){const rg=box(0.08,0.2,2.05,mDark);rg.position.set(i,1.62,0);g.add(rg);}const eM=new THREE.MeshStandardMaterial({color:0x0c1420,roughness:1});const e1=box(0.3,0.9,1.3,eM);e1.position.set(-3.5,0.85,0);g.add(e1);const e2=e1.clone();e2.position.x=3.5;g.add(e2);g.userData={w:7.4,d:2.2,top:2.5};return g;}

      speed=m.value; if(speedSel) speedSel.value=String(m.value);
    }
    else if(m.action==='reset'){setPlaying(false);applyPlanTime(tMin);}
  });
  // Announce readiness so the parent can request an initial tick.
  if(window.parent!==window){
    try{ window.parent.postMessage({type:'lw:ready'},'*'); }catch(e){}
  }

  // ─── Demo: cinematic director (slowmo + always-moving camera) ─────────────
  const demoBtn=document.getElementById('sim-demo');
  // (slowmo badge removed — slowmo behaviour kept, just no on-screen indicator)
  let slowmoFactor=1.0;

  function _v(x,y,z){return new THREE.Vector3(x,y,z);}
  function _lerp(a,b,t){return a+(b-a)*t;}
  function _easeInOut(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
  function _easeOut(t){return 1-Math.pow(1-t,3);}

  // Shot primitives — each returns a function (u in [0,1]) -> {pos, target}
  function shotEstablish(){
    return (u)=>{
      const e=_easeInOut(u);
      // sweep ~35° around origin while descending from y=40 to y=18
      const ang0=-0.6, ang1=0.4;
      const a=_lerp(ang0,ang1,e);
      const r=_lerp(54,40,e);
      const y=_lerp(40,18,e);
      return {pos:_v(Math.sin(a)*r, y, Math.cos(a)*r), target:_v(0,2,0)};
    };
  }
  function shotLineDolly(lineId){
    const z=Z_BY_LINE[lineId];
    return (u)=>{
      const e=_easeInOut(u);
      // dolly along the line at a 3/4 angle from one end to the other
      const x=_lerp(-30,30,e);
      return {pos:_v(x, 7, z+11), target:_v(x*0.4, 1.5, z)};
    };
  }
  function shotStationOrbit(lineId, stationKey){
    const z=Z_BY_LINE[lineId];
    const s=stationByLine[lineId]&&stationByLine[lineId][stationKey];
    const sx=s?s.x:0, top=s?(s.top||2):2;
    return (u)=>{
      // half-circle orbit (210°) at radius 7, height bobs 3→5→3
      const a=(-Math.PI*0.55) + u*Math.PI*1.15;
      const r=7.5;
      const y=3 + 2.0*Math.sin(u*Math.PI);
      return {pos:_v(sx + Math.cos(a)*r, y, z + Math.sin(a)*r), target:_v(sx, top*0.5+0.6, z)};
    };
  }
  function shotLowPushIn(lineId, stationKey){
    const z=Z_BY_LINE[lineId];
    const s=stationByLine[lineId]&&stationByLine[lineId][stationKey];
    const sx=s?s.x:0, top=s?(s.top||2):2;
    return (u)=>{
      const e=_easeInOut(u);
      // start far + low + offset, push in along axis
      const dist=_lerp(14, 5.5, e);
      const y=_lerp(1.8, 3.2, e);
      const side=_lerp(4.5, 2.0, e);
      return {pos:_v(sx-dist*0.5, y, z+side), target:_v(sx, top*0.45+0.3, z)};
    };
  }
  function shotPullBack(){
    return (u)=>{
      const e=_easeOut(u);
      // pull back to wide overhead, slight orbit during the hold
      const angDrift=u*0.4;
      const r=_lerp(28, 50, e);
      const y=_lerp(14, 32, e);
      const a=-0.55 + angDrift;
      return {pos:_v(Math.sin(a)*r, y, Math.cos(a)*r), target:_v(0,2,0)};
    };
  }

  function pickHeroEvents(){
    const cand=[];
    Object.keys(PLAN_LINES).forEach(lk=>{
      const arr=PLAN_LINES[lk]||[];
      for(let i=0;i<arr.length;i++){
        const b=arr[i];
        if(!b.changeoverType || !b.changeoverStations || !b.changeoverStations.length) continue;
        const prev = i>0 ? arr[i-1] : null;
        const prevOee = prev?(prev.oee||0.7):0.7;
        const oeeDelta = Math.abs((b.oee||0.7)-prevOee);
        const baseScore = b.changeoverType==='brand'?3:(b.changeoverType==='format'?2:1);
        cand.push({epoch:b.start, line:lk, station:b.changeoverStations[0], score:baseScore + 2*oeeDelta, sku:b.sku, brand:b.brand});
      }
    });
    cand.sort((a,b)=>b.score-a.score);
    const chosen=[];
    const span=tMax-tMin;
    const minGap=span/8;
    for(const c of cand){
      if(chosen.length>=4) break;
      if(chosen.every(ch=>Math.abs(ch.epoch-c.epoch)>=minGap)) chosen.push(c);
    }
    chosen.sort((a,b)=>a.epoch-b.epoch);
    return chosen;
  }

  function buildTimeline(){
    const heroes=pickHeroEvents();
    const tl=[];
    // OPEN
    tl.push({label:'OPEN', shot:shotEstablish(), simStart:tMin, simEnd:tMin+4*3600*1000, dur:9500, slowmo:false});
    heroes.forEach((h,idx)=>{
      const prevEnd=tl[tl.length-1].simEnd;
      const cruiseEndSim=Math.max(prevEnd+60*60*1000, h.epoch - 25*60*1000);
      if(cruiseEndSim>prevEnd){
        tl.push({label:'CRUISE', shot:shotLineDolly(h.line), simStart:prevEnd, simEnd:cruiseEndSim, dur:9000, slowmo:false});
      }
      tl.push({label:'APPROACH', shot:shotLowPushIn(h.line, h.station), simStart:cruiseEndSim, simEnd:h.epoch, dur:5000, slowmo:'ramp'});
      tl.push({label:'HERO', shot:shotStationOrbit(h.line, h.station), simStart:h.epoch, simEnd:h.epoch+8*60*1000, dur:11000, slowmo:true, hero:h});
    });
    // CLOSE
    tl.push({label:'CLOSE', shot:shotPullBack(), simStart:tl[tl.length-1].simEnd, simEnd:tMax, dur:12000, slowmo:false});
    return tl;
  }

  const demoState={
    active:false, timeline:[], idx:0, phaseStart:0, prevSpeed:4,
    prevPose:null, crossfadeMs:1400,
    start(){
      if(!P||tMax<=tMin)return;
      this.active=true;
      this.timeline=buildTimeline();
      if(!this.timeline.length){this.active=false; return;}
      this.idx=0;
      this.phaseStart=performance.now();
      this.prevSpeed=speed;
      // stop user playback; director owns the playhead directly
      setPlaying(false);
      if(controls){controls.enabled=false;}
      // seed prevPose with current camera state for the opening cross-fade
      this.prevPose={pos:camera.position.clone(), target: controls?controls.target.clone():_v(0,2,0)};
      cameraFly=null; // cancel any manual fly
      demoBtn.classList.add('lw-active');
      demoBtn.textContent='■ Demo';
      // prime first frame
      const ph=this.timeline[0];
      applyPlanTime(ph.simStart);
    },
    cancel(reason){
      if(!this.active)return;
      this.active=false;
      this.timeline=[]; this.idx=0;
      slowmoFactor=1.0;
      setPlaying(false);
      speed=this.prevSpeed; speedSel.value=String(this.prevSpeed);
      if(controls){controls.enabled=true;}
      demoBtn.classList.remove('lw-active');
      demoBtn.textContent='▷ Demo';
    },
    tick(nowMs){
      if(!this.active)return;
      if(this.idx>=this.timeline.length){this.cancel('end'); return;}
      const ph=this.timeline[this.idx];
      let u=(nowMs-this.phaseStart)/ph.dur;
      if(u>=1){
        // advance — capture end pose for cross-fade
        const endPose=ph.shot(1);
        this.prevPose={pos:_v(endPose.pos.x,endPose.pos.y,endPose.pos.z), target:_v(endPose.target.x,endPose.target.y,endPose.target.z)};
        this.idx++;
        this.phaseStart=nowMs;
        if(this.idx>=this.timeline.length){this.cancel('end'); return;}
        u=0;
      }
      const cur=this.timeline[this.idx];
      // advance sim playhead
      const simT=_lerp(cur.simStart, cur.simEnd, _easeInOut(u));
      applyPlanTime(simT);
      // open side panel for HERO shots
      if(cur.label==='HERO' && cur.hero && u<0.05){
        const s=stationByLine[cur.hero.line]&&stationByLine[cur.hero.line][cur.hero.station];
        if(s) show(s);
      }
      // pose with cross-fade at phase boundaries
      const pose=cur.shot(u);
      const crossU=Math.min(1, (nowMs-this.phaseStart)/this.crossfadeMs);
      let camPos=pose.pos, camTgt=pose.target;
      if(crossU<1 && this.prevPose){
        const ce=_easeInOut(crossU);
        camPos=_v(_lerp(this.prevPose.pos.x,pose.pos.x,ce), _lerp(this.prevPose.pos.y,pose.pos.y,ce), _lerp(this.prevPose.pos.z,pose.pos.z,ce));
        camTgt=_v(_lerp(this.prevPose.target.x,pose.target.x,ce), _lerp(this.prevPose.target.y,pose.target.y,ce), _lerp(this.prevPose.target.z,pose.target.z,ce));
      }
      camera.position.copy(camPos);
      if(controls){controls.target.copy(camTgt); controls.update();}
      else camera.lookAt(camTgt);
      // slowmo factor
      let targetFactor=1.0;
      if(cur.slowmo===true) targetFactor=0.3;
      else if(cur.slowmo==='ramp') targetFactor=_lerp(1.0, 0.3, _easeInOut(u));
      slowmoFactor=targetFactor;
    }
  };
  window.__lwDemo=demoState;
  demoBtn.addEventListener('click',()=>{
    if(demoState.active) demoState.cancel('user');
    else demoState.start();
  });
  // cancel demo on any direct interaction with sim controls
  ['sim-play','sim-prev','sim-next'].forEach(id=>{document.getElementById(id).addEventListener('click',()=>{if(demoState.active)demoState.cancel('user');});});
  scrubber.addEventListener('pointerdown',()=>{if(demoState.active)demoState.cancel('user');});
  speedSel.addEventListener('focus',()=>{if(demoState.active)demoState.cancel('user');});

  // ─── Animation loop ───────────────────────────────────────────────────────
  let tm=0; const tickDt=0.025;
  function loop(){requestAnimationFrame(loop);tm+=tickDt;
    if(playing&&tMax>tMin){
      const next=playhead+SIM_SEC_PER_TICK*1000*speed;
      if(next>=tMax){applyPlanTime(tMax);setPlaying(false);}
      else applyPlanTime(next);
    }
    // cans + belt scroll (slowmoFactor scales scene action during demo hero shots)
    cans.forEach(c=>{
      const mult=(lineSpeedMult[c.userData.lineKey]||0)*slowmoFactor;
      c.userData.d+=0.07*mult;
      if(c.userData.d>L_total)c.userData.d-=L_total;
      c.position.x=X0+c.userData.d;
    });
    Object.keys(beltMat).forEach(lk=>{const t=beltMat[lk].map; if(t){t.offset.x-=0.006*(lineSpeedMult[lk]||0)*slowmoFactor;}});

    // per-line LED indicator (subtle brand cue, picked up by bloom)
    Object.keys(lineGlow).forEach(lk=>{
      const lg=lineGlow[lk];
      // Snap color when close enough so we stop lerping every frame forever
      const c=lg.ledMat.color, ac=lg.activeColor;
      const d=Math.abs(c.r-ac.r)+Math.abs(c.g-ac.g)+Math.abs(c.b-ac.b);
      if(d>0.003){
        c.lerp(ac,0.08);
        lg.ledMat.emissive.lerp(ac,0.08);
      } else if(d>0){
        c.copy(ac); lg.ledMat.emissive.copy(ac);
      }
      if(lg.isActive){lg.ledMat.emissiveIntensity=2.4 + 1.0*Math.sin(tm*1.8 + (lk==='L14'?0:lk==='L17'?2.1:4.2));}
      else if(lg.ledMat.emissiveIntensity!==0.05){lg.ledMat.emissiveIntensity=0.05;}
    });

    // pad pulsing + per-station changeover flash overlay.
    // Iterate only the sparse flashState + the single selected station instead of
    // walking all 33 station refs every frame.
    const nowMs=performance.now();
    let selectedFlashed=false;
    for(const fk in flashState){
      const exp=flashState[fk];
      const sep=fk.indexOf('|');
      const lineKey=fk.slice(0,sep), stk=fk.slice(sep+1);
      const lineMap=stationByLine[lineKey];
      const s=lineMap&&lineMap[stk];
      if(!s) continue;
      if(nowMs<exp){
        const pulse=0.7+0.3*Math.abs(Math.sin(tm*8.0));
        s.pad.material.color.copy(FLASH_COLOR);
        s.pad.material.opacity=Math.min(0.95,0.55+0.4*pulse);
        if(s===selected) selectedFlashed=true;
      } else {
        delete flashState[fk];
        recolorStation(s,s.oee);
        s.pad.material.opacity=s.padBase;
      }
    }
    if(selected && !selectedFlashed){
      const pl=0.7+0.3*Math.sin(tm*2.4);
      selected.pad.material.opacity=Math.min(0.95,selected.padBase+0.3+0.18*pl);
    }

    // particles (steam + sparks) — skip the per-particle loop and GPU buffer
    // re-upload entirely when the line is idle AND no particles are still alive.
    const dt=tickDt;
    Object.keys(steamSystems).forEach(lk=>{
      const sys=steamSystems[lk]; const active=(lineSpeedMult[lk]||0)>0.01;
      if(!active && sys.allDead) return;
      let anyAlive=false;
      for(let i=0;i<sys.N;i++){
        sys.age[i]+=dt*1.1;
        if(sys.age[i]>=sys.maxAge[i]){
          if(active){
            const sp=sys.spawnPos[i%sys.spawnPos.length];
            sys.positions[i*3]=sp.x+(Math.random()-0.5)*0.55;
            sys.positions[i*3+1]=sp.y;
            sys.positions[i*3+2]=sp.z+(Math.random()-0.5)*0.55;
            sys.vel[i]={x:(Math.random()-0.5)*0.45, y:0.45+Math.random()*0.35, z:(Math.random()-0.5)*0.45};
            sys.age[i]=0;
            sys.maxAge[i]=1.4+Math.random()*1.1;
            anyAlive=true;
          } else {
            sys.colors[i*3]=0;sys.colors[i*3+1]=0;sys.colors[i*3+2]=0; continue;
          }
        } else {
          anyAlive=true;
        }
        sys.positions[i*3]+=sys.vel[i].x*dt;
        sys.positions[i*3+1]+=sys.vel[i].y*dt;
        sys.positions[i*3+2]+=sys.vel[i].z*dt;
        const fade=Math.max(0,1-sys.age[i]/sys.maxAge[i]);
        const f=fade*fade*0.85;
        sys.colors[i*3]=0.78*f; sys.colors[i*3+1]=0.86*f; sys.colors[i*3+2]=f;
      }
      sys.allDead=!active && !anyAlive;
      sys.pts.geometry.attributes.position.needsUpdate=true;
      sys.pts.geometry.attributes.color.needsUpdate=true;
    });
    Object.keys(sparkSystems).forEach(lk=>{
      const sys=sparkSystems[lk];
      if(sys.allDead) return;
      let anyAlive=false;
      for(let i=0;i<sys.N;i++){
        if(sys.age[i]>=sys.maxAge){sys.colors[i*3]=0;sys.colors[i*3+1]=0;sys.colors[i*3+2]=0;continue;}
        anyAlive=true;
        sys.age[i]+=dt;
        sys.positions[i*3]+=sys.vel[i].x*dt;
        sys.positions[i*3+1]+=sys.vel[i].y*dt;
        sys.positions[i*3+2]+=sys.vel[i].z*dt;
        sys.vel[i].y-=4.2*dt;
        const fade=Math.max(0,1-sys.age[i]/sys.maxAge);
        sys.colors[i*3]=fade; sys.colors[i*3+1]=0.96*fade; sys.colors[i*3+2]=0.77*fade;
      }
      sys.allDead=!anyAlive;
      sys.pts.geometry.attributes.position.needsUpdate=true;
      sys.pts.geometry.attributes.color.needsUpdate=true;
    });

    // workers + forklift
    workers.forEach(w=>{const sw=Math.sin(tm*6+w.userData.ph);if(w.userData.la){w.userData.la.rotation.x=sw*0.5;w.userData.ra.rotation.x=-sw*0.5;}if(!w.userData.static){w.position.x+=w.userData.dir*w.userData.spd*slowmoFactor;if(w.userData.legs)w.userData.legs.position.y=0.35+Math.abs(sw)*0.04;if(w.position.x>29){w.position.x=-29;}if(w.position.x<-29){w.position.x=29;}}});
    fk.userData.d+=0.05*slowmoFactor;const fd=fk.userData.d%80;let fx,fz,fr;if(fd<20){fx=-27+fd*1.35;fz=19;fr=1.5708;}else if(fd<40){fx=0;fz=19-(fd-20)*1.0;fr=3.14;}else if(fd<60){fx=(fd-40)*1.35;fz=-1;fr=-1.5708;}else{fx=27;fz=-1+(fd-60)*1.0;fr=0;}fk.position.set(Math.max(-28,Math.min(28,fx)),0,Math.max(-20,Math.min(20,fz)));fk.rotation.y=fr;

    // camera fly tween
    if(cameraFly){
      const u=Math.min(1,(nowMs-cameraFly.start)/cameraFly.dur);
      const e=easeInOutCubic(u);
      camera.position.lerpVectors(cameraFly.p0, cameraFly.p1, e);
      if(controls){controls.target.lerpVectors(cameraFly.tgt0, cameraFly.tgt1, e); controls.update();}
      else camera.lookAt(cameraFly.tgt0.clone().lerp(cameraFly.tgt1,e));
      if(u>=1){cameraFly=null; if(controls)controls.enabled=true;}
    } else if(controls){
      // idle auto-drift azimuth
      const idleFor=nowMs-lastInteractAt;
      if(idleFor>6000 && !(window.__lwDemo&&window.__lwDemo.active)){
        const o=controls.target;
        const off=new THREE.Vector3().subVectors(camera.position,o);
        const sph=new THREE.Spherical().setFromVector3(off);
        sph.theta-=0.0008;
        off.setFromSpherical(sph);
        camera.position.copy(o).add(off);
      }
      controls.update();
    }

    // demo autopilot tick
    if(window.__lwDemo&&window.__lwDemo.active){window.__lwDemo.tick(nowMs);}

    if(composer)composer.render(); else renderer.render(scene,camera);
  }
  // ─── Asset bootstrap: patch materials with PBR maps, swap reflective floor ─
  function applyTilingTex(t, repX, repY){
    if(!t)return;
    t.wrapS=t.wrapT=THREE.RepeatWrapping;
    t.repeat.set(repX, repY||repX);
  }
  function patchAssets(){
    try {
      // remove the temporary boot ambient — HDRI + key + rim now carry the scene
      scene.remove(boot_ambient);

      // mBody (painted machinery)
      const pm=assets.textures.painted;
      if(pm.map){
        applyTilingTex(pm.map, 1.4); applyTilingTex(pm.normalMap, 1.4); applyTilingTex(pm.roughnessMap, 1.4);
        mBody.map=pm.map; mBody.normalMap=pm.normalMap; mBody.roughnessMap=pm.roughnessMap;
        mBody.needsUpdate=true;
      }
      // mSteel (brushed steel)
      const st=assets.textures.steel;
      if(st.map){
        applyTilingTex(st.map, 1.0); applyTilingTex(st.normalMap, 1.0); applyTilingTex(st.roughnessMap, 1.0);
        mSteel.map=st.map; mSteel.normalMap=st.normalMap; mSteel.roughnessMap=st.roughnessMap;
        mSteel.needsUpdate=true;
      }
      // Plain textured concrete floor (no reflector)
      const cf=assets.textures.concrete;
      if(cf.map){
        applyTilingTex(cf.map, 10, 7);
        applyTilingTex(cf.normalMap, 10, 7);
        applyTilingTex(cf.roughnessMap, 10, 7);
        applyTilingTex(cf.aoMap, 10, 7);
        // floor PlaneGeometry needs uv2 for the AO map
        if(floor.geometry && floor.geometry.attributes.uv && !floor.geometry.attributes.uv2){
          floor.geometry.setAttribute('uv2', new THREE.BufferAttribute(floor.geometry.attributes.uv.array, 2));
        }
        floor.material.map=cf.map;
        floor.material.normalMap=cf.normalMap;
        floor.material.roughnessMap=cf.roughnessMap;
        floor.material.aoMap=cf.aoMap;
        // Reset tint so the diffuse map shows true luminance (was 0x4a5260 — darkened it)
        floor.material.color.setHex(0xffffff);
        floor.material.aoMapIntensity=0.7;
        floor.material.needsUpdate=true;
      }
      // Boost env intensity broadly so HDRI fills the scene; metals get more
      scene.traverse(n=>{
        if(n.isMesh && n.material && 'envMapIntensity' in n.material){
          n.material.envMapIntensity = (n.material.metalness||0) >= 0.5 ? 1.8 : 1.3;
        }
      });
      // Subtle phase-color tints on each station type so the process flow reads.
      // Grouped into 5 phases — kept mild (multiplies the painted-metal texture).
      const PHASE_TINT = {
        cip:  0x7aa9d8, rin:  0x7aa9d8, fill: 0x7aa9d8,   // liquid prep — cool blue
        cod:  0xd47ba8,                                    // coding — pink
        pas:  0xe09a64,                                    // pasteurization — warm peach
        lev:  0x7ac8a4, vac:  0x7ac8a4,                    // inspection — mint
        pak:  0xb8b870, ctn:  0xb8b870, pal:  0xb8b870, wrp: 0xb8b870, // packaging — sage
      };
      const _tintBody = {}, _tintDark = {};
      function tintedFor(cache, base, stk, scale){
        if(!_tint(stk)) return base;
        if(!cache[stk]){
          const m = base.clone();
          m.color = new THREE.Color(PHASE_TINT[stk]);
          if(scale) m.color.multiplyScalar(scale);
          cache[stk] = m;
        }
        return cache[stk];
      }
      function _tint(stk){ return !!PHASE_TINT[stk]; }
      machineGroups.forEach(g=>{
        const stk = g.userData.station && g.userData.station.stationKey;
        if(!_tint(stk)) return;
        g.traverse(n=>{
          if(!n.isMesh) return;
          if(n.material === mBody) n.material = tintedFor(_tintBody, mBody, stk);
          else if(n.material === mDark) n.material = tintedFor(_tintDark, mDark, stk, 0.5);
        });
      });
      // Small phase "puck" on top of each station so the color reads from above
      const _puckGeom = new THREE.CylinderGeometry(0.22, 0.22, 0.06, 24);
      machineGroups.forEach(g=>{
        const sObj = g.userData.station;
        if(!sObj) return;
        const hex = PHASE_TINT[sObj.stationKey]; if(!hex) return;
        const m = new THREE.MeshStandardMaterial({
          color: hex, emissive: hex, emissiveIntensity: 0.45,
          metalness: 0.1, roughness: 0.55
        });
        const puck = new THREE.Mesh(_puckGeom, m);
        puck.position.set(sObj.x, (sObj.top || 2) + 0.05, g.userData.lineZ);
        scene.add(puck);
      });
    } catch(e){
      console.warn('[lw] patchAssets failed', e);
    }
  }
  function hideOverlay(){
    const ovl=document.getElementById('lw-loading');
    if(ovl && ovl.style.opacity!=='0'){ ovl.style.opacity='0'; setTimeout(()=>{ovl.style.display='none';}, 550); }
  }

  // Split boot into two phases so the user sees the scene immediately while
  // the 6.6 MB HDRI + PBR textures finish downloading in the background.
  // Phase 1 (startRender): kick off the render loop ASAP with the fallback
  // ambient + key + rim lighting. Phase 2 (patchAssets): swap in textures +
  // env intensity once the LoadingManager reports done. Idempotent guards
  // make it safe to fire either path more than once.
  let _rendering=false, _patched=false;
  function startRender(){if(_rendering)return; _rendering=true; hideOverlay(); loop();}
  function applyAssets(){if(_patched)return; _patched=true; patchAssets(); startRender();}
  // Back-compat for any external caller (window.__lwSafeBoot was the old name).
  window.__lwSafeBoot=applyAssets;
  manager.onLoad=applyAssets;
  // If everything already loaded before we got here (LoadingManager misses the
  // event if onLoad wasn't set at the time itemsLoaded reached itemsTotal):
  if(manager.isLoading===false){ applyAssets(); }
  // Show the scene fast — render starts even if HDRI is still downloading.
  setTimeout(startRender, 400);
  // Safety net in case both onLoad and onError silently drop.
  setTimeout(applyAssets, 8000);

  window.addEventListener('resize',()=>{
    camera.aspect=W()/H();camera.updateProjectionMatrix();renderer.setSize(W(),H());
    if(composer)composer.setSize(W(),H());
    if(bloomPass)bloomPass.setSize(W()*0.5,H()*0.5);
  });
})();
</script>
