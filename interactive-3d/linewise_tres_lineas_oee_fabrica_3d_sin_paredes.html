<style>

<div id="scene-wrap" style="position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden;background:#05080f;font-family:var(--font-sans),system-ui,sans-serif">

  <div style="position:absolute;top:16px;left:18px;color:#cbd5e1;pointer-events:none;z-index:3">
    <div style="font-size:16px;font-weight:500;color:#f1f5f9;letter-spacing:.2px">LineWise · El Prat · Líneas de latas</div>
    <div id="subtitle" style="font-size:12px;color:#8ca0bd;margin-top:3px">Simulación del plan semanal · L14 · L17 · L19 — color = OEE previsto · arrastra para girar · clic en una máquina</div>
  </div>

  <div id="linecards" style="position:absolute;top:62px;right:16px;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:3"></div>

  <!-- Plan simulation overlay: scrubber + play -->
  <div id="overlay-sim" style="position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(8,15,28,0.86);border:1px solid rgba(148,163,184,0.22);border-radius:11px;color:#e2e8f0;backdrop-filter:blur(7px);font-size:12px;z-index:4;min-width:620px">
    <button id="sim-play" style="background:rgba(37,99,235,0.4);color:#fff;border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:13px">▶</button>
    <button id="sim-prev" title="− 1 h" style="background:transparent;color:#8ca0bd;border:1px solid rgba(148,163,184,0.25);width:26px;height:26px;border-radius:50%;cursor:pointer">‹</button>
    <button id="sim-next" title="+ 1 h" style="background:transparent;color:#8ca0bd;border:1px solid rgba(148,163,184,0.25);width:26px;height:26px;border-radius:50%;cursor:pointer">›</button>
    <input id="sim-scrubber" type="range" min="0" max="1" value="0" step="any" style="flex:1;accent-color:#2563eb">
    <select id="sim-speed" title="Velocidad de simulación" style="background:#0c1422;color:#e2e8f0;border:1px solid rgba(148,163,184,0.25);padding:4px 6px;border-radius:6px;font-size:11px">
      <option value="1">1×</option>
      <option value="2">2×</option>

  </div>

  <div id="legend" style="position:absolute;bottom:74px;left:18px;color:#aab8cc;font-size:11px;pointer-events:none;line-height:1.7;z-index:3">
    <div style="display:flex;align-items:center;gap:7px">OEE
      <span style="display:inline-block;width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,#ff3b3b,#f2a623,#19c37d)"></span> alto</div>
    <div style="margin-top:2px">Anillo ámbar = cuello de botella · anillo rojo = cambio costoso</div>
  </div>

  <div id="panel" style="position:absolute;top:62px;left:18px;width:248px;background:rgba(8,15,28,0.86);border:1px solid rgba(148,163,184,0.22);border-radius:13px;padding:15px;color:#e2e8f0;font-size:13px;backdrop-filter:blur(7px);display:none;z-index:3">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span id="p-dot" class="lw-glow-dot" style="width:10px;height:10px;border-radius:50%;flex:none;color:#19c37d;background:currentColor"></span><span id="p-name" style="font-size:15px;font-weight:500;color:#fff"></span></div>
    <div id="p-line" style="font-size:11px;color:#8ca0bd;margin-bottom:9px"></div>
    <div style="display:flex;justify-content:space-between;margin:6px 0"><span style="color:#8ca0bd">OEE línea</span><span id="p-oee" style="font-weight:500"></span></div>
    <div id="p-block-row" style="display:none;margin-top:8px;padding-top:8px;border-top:1px solid rgba(148,163,184,0.18)">
      <div style="color:#8ca0bd;font-size:11px">Bloque en curso</div>
      <div id="p-block" style="margin-top:3px;color:#e2e8f0;font-size:12px;line-height:1.5"></div>
    </div>
    <div id="p-fail-row" style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(148,163,184,0.18)">
      <div style="color:#8ca0bd;font-size:11px">Fallo típico</div>
      <div id="p-fail" style="margin-top:3px;color:#cbd5e1;font-size:12px"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/FXAAShader.js"></script>

<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
  const P = window.__LINEWISE_PLAN__ || null;

  const STAGES=[
    {key:'cip',  name:'CIP Station',             type:'tanks'},
    {key:'rin',  name:'Rinser',                  type:'rinser'},
    {key:'fill', name:'Can filling & seamer',    type:'filler'},
    {key:'cod',  name:'Codification',            type:'coder'},
    {key:'pas',  name:'Tunnel Pasteurization',   type:'tunnel'},
    {key:'lev',  name:'Fill/level Inspection',   type:'gantry'},
    {key:'vac',  name:'Vacuum Inspection',       type:'gantry'},
    {key:'pak',  name:'Packaging',               type:'pack'},
    {key:'ctn',  name:'Carton & plastic Formats',type:'cartons'},
    {key:'pal',  name:'Palletizer',              type:'pallet'},
    {key:'wrp',  name:'Pallet Wrap',             type:'wrap'}
  ];
  const FAIL={cip:'Válvula de dosificación',rin:'Atasco de latas',fill:'Microfugas en el cierre',pas:'Deriva de temperatura',cod:'Cabezal de tinta seco',vac:'Falsos rechazos',lev:'Calibración de sensor',pak:'Rotura de film',ctn:'Plegado de cartón',pal:'Brazo desalineado',wrp:'Tensión de film'};

  // Build LINES — geometry baseline only; live OEE comes from the plan blocks.
  const DEFAULTS={L14:{oee:0.7,formats:['50cl','33cl']},L17:{oee:0.7,formats:['33cl']},L19:{oee:0.7,formats:['50cl','33cl','44cl']}};
  const Z_BY_LINE={L14:-13,L17:0,L19:13};
  const LINES=Object.keys(DEFAULTS).map(id=>({
    id, z:Z_BY_LINE[id], oee:DEFAULTS[id].oee, baseOee:DEFAULTS[id].oee,
    formats:DEFAULTS[id].formats
  }));

  const X0=-24.5,DX=4.9;

  // ─── Three setup ──────────────────────────────────────────────────────────
  const holder=document.getElementById('canvas-holder');
  const W=()=>holder.clientWidth||680,H=()=>holder.clientHeight||640;
  const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x070c16,0.012);
  const camera=new THREE.PerspectiveCamera(48,W()/H(),0.1,400);
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
  renderer.setClearColor(0x05080f,1);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(W(),H());
  renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.12;
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  holder.appendChild(renderer.domElement);

  // Post-processing: bloom + FXAA (graceful fallback if scripts didn't load)
  let composer=null, bloomPass=null, fxaaPass=null;
  if(THREE.EffectComposer && THREE.UnrealBloomPass && THREE.ShaderPass && THREE.FXAAShader){
    composer=new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene,camera));
    bloomPass=new THREE.UnrealBloomPass(new THREE.Vector2(W(),H()),1.0,0.45,0.72);
    composer.addPass(bloomPass);
    fxaaPass=new THREE.ShaderPass(THREE.FXAAShader);
    fxaaPass.material.uniforms.resolution.value.set(1/(W()*renderer.getPixelRatio()),1/(H()*renderer.getPixelRatio()));
    composer.addPass(fxaaPass);
  }

  scene.add(new THREE.HemisphereLight(0xbcd2f5,0x0a1020,0.32));
  scene.add(new THREE.AmbientLight(0x35507a,0.34));
  const sun=new THREE.DirectionalLight(0xfff1d4,0.95);sun.position.set(18,30,14);
  sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left=-36; sun.shadow.camera.right=36;
  sun.shadow.camera.top=26; sun.shadow.camera.bottom=-26;
  sun.shadow.camera.near=4; sun.shadow.camera.far=80;
  sun.shadow.bias=-0.0005; sun.shadow.normalBias=0.04;
  scene.add(sun);
  [[-18,-13],[0,0],[18,13],[-18,13],[18,-13]].forEach(p=>{const pl=new THREE.PointLight(0x6fb2ff,0.28,60);pl.position.set(p[0],14,p[1]);scene.add(pl);});

  function box(w,h,d,m){return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);}
  function cyl(a,b,h,m,s){return new THREE.Mesh(new THREE.CylinderGeometry(a,b,h,s||20),m);}
  const mBody=new THREE.MeshStandardMaterial({color:0x9aa7b7,metalness:0.55,roughness:0.42});
  const mDark=new THREE.MeshStandardMaterial({color:0x515d6e,metalness:0.6,roughness:0.5});
  const mSteel=new THREE.MeshStandardMaterial({color:0xc4cedb,metalness:0.7,roughness:0.3});
  const mBlue=new THREE.MeshStandardMaterial({color:0x2563eb,metalness:0.35,roughness:0.4,emissive:0x1e40af,emissiveIntensity:0.25});
  const mBelt=new THREE.MeshStandardMaterial({color:0x141c29,metalness:0.2,roughness:0.85});
  const mGlass=new THREE.MeshStandardMaterial({color:0x223247,metalness:0.3,roughness:0.2,transparent:true,opacity:0.55});

  const SHX=64,SHZ=46;
  const floorMat=new THREE.MeshStandardMaterial({color:0x47505e,metalness:0.1,roughness:0.92});
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(SHX,SHZ),floorMat);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
  for(let i=-2;i<=2;i++){const lane=box(SHX,0.02,0.18,new THREE.MeshStandardMaterial({color:0xf2c200,roughness:0.7,emissive:0x3a2c00,emissiveIntensity:0.3}));lane.position.set(0,0.02,i*6.5+ (i>0?2.5:i<0?-2.5:0));scene.add(lane);}
  const beamMat=new THREE.MeshStandardMaterial({color:0x2c3a4d,metalness:0.6,roughness:0.5});
  for(let i=-3;i<=3;i++){const tr=box(SHX,0.5,0.5,beamMat);tr.position.set(0,15.6,i*7);scene.add(tr);}
  for(let i=-3;i<=3;i++){const lt=box(8,0.25,0.6,new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xbfe0ff,emissiveIntensity:0.9}));lt.position.set(0,15.2,i*7);scene.add(lt);}

  function tanks(){const g=new THREE.Group();const b=box(4,0.3,2.2,mDark);b.position.y=0.15;g.add(b);for(let i=-1;i<=1;i++){const t=cyl(0.7,0.7,3,mSteel);t.position.set(i*1.2,1.7,0);g.add(t);const c=new THREE.Mesh(new THREE.SphereGeometry(0.7,16,10,0,6.3,0,1.57),mSteel);c.position.set(i*1.2,3.2,0);g.add(c);}g.userData={w:4.4,d:2.4,top:3.6};return g;}
  function rinser(){const g=new THREE.Group();const c=box(1.7,1.8,1.5,mBody);c.position.y=0.9;g.add(c);const sw=cyl(0.7,0.7,0.25,mSteel);sw.position.y=1.95;g.add(sw);const p=box(0.5,0.7,0.05,mGlass);p.position.set(0,1,0.78);g.add(p);g.userData={w:2,d:1.7,top:2.1};return g;}
  function filler(){const g=new THREE.Group();const b=cyl(2,2.1,0.5,mDark);b.position.y=0.25;g.add(b);const car=cyl(1.85,1.85,1.5,mBody);car.position.y=1.25;g.add(car);const tp=cyl(1.95,1.95,0.22,mDark);tp.position.y=2.1;g.add(tp);for(let i=0;i<14;i++){const a=i/14*6.283;const h=cyl(0.07,0.07,0.85,mSteel);h.position.set(Math.cos(a)*1.55,2.55,Math.sin(a)*1.55);g.add(h);}const cap=cyl(0.9,1,0.3,mDark);cap.position.y=3;g.add(cap);g.userData={w:4,d:2.6,top:3.2};return g;}
  function tunnel(){const g=new THREE.Group();const b=box(7,1.5,1.9,mBody);b.position.y=0.85;g.add(b);const r=cyl(0.95,0.95,7,mDark,18);r.rotation.z=1.5708;r.position.y=1.6;g.add(r);for(let i=-2.6;i<=2.6;i+=0.65){const rg=box(0.08,0.2,2.05,mDark);rg.position.set(i,1.62,0);g.add(rg);}const eM=new THREE.MeshStandardMaterial({color:0x0c1420,roughness:1});const e1=box(0.3,0.9,1.3,eM);e1.position.set(-3.5,0.85,0);g.add(e1);const e2=e1.clone();e2.position.x=3.5;g.add(e2);g.userData={w:7.4,d:2.2,top:2.5};return g;}
  function coder(){const g=new THREE.Group();const c=box(1.2,1.5,1.1,mBody);c.position.set(-0.3,0.75,0);g.add(c);const s=box(0.6,0.5,0.04,mGlass);s.position.set(-0.3,1.1,0.57);g.add(s);const a=box(1,0.12,0.12,mDark);a.position.set(0.4,1.3,0);g.add(a);const h=box(0.22,0.3,0.3,mSteel);h.position.set(0.9,1.2,0);g.add(h);g.userData={w:1.6,d:1.2,top:1.6};return g;}
  function gantry(){const g=new THREE.Group();const p1=box(0.25,2.4,0.25,mDark);p1.position.set(0,1.2,-0.95);g.add(p1);const p2=p1.clone();p2.position.z=0.95;g.add(p2);const bm=box(0.3,0.3,2.4,mBody);bm.position.y=2.4;g.add(bm);const s=box(0.7,0.5,0.7,mSteel);s.position.y=1.95;g.add(s);const l=cyl(0.18,0.18,0.15,mBlue);l.position.y=1.65;g.add(l);g.userData={w:1.1,d:2.3,top:2.7};return g;}
  function pack(){const g=new THREE.Group();const c=box(2.6,2,2.2,mBody);c.position.y=1;g.add(c);const m=box(0.05,1.2,1.5,new THREE.MeshStandardMaterial({color:0x0c1420,roughness:1}));m.position.set(1.3,0.9,0);g.add(m);const h=box(1.2,0.6,1.6,mDark);h.position.set(-0.3,2.1,0);g.add(h);g.userData={w:2.8,d:2.4,top:2.5};return g;}
  function pallet(){const g=new THREE.Group();const b=box(2.2,0.4,2.2,mDark);b.position.y=0.2;g.add(b);const col=box(0.55,3.2,0.55,mBody);col.position.set(-0.6,1.8,0);g.add(col);const a=box(2.2,0.32,0.32,mBody);a.position.set(0.4,3.1,0);g.add(a);const gr=box(0.5,0.5,0.7,mSteel);gr.position.set(1.4,2.85,0);g.add(gr);for(let i=0;i<3;i++){const pl=box(1.5,0.28,1.5,new THREE.MeshStandardMaterial({color:0xb98a4e,roughness:0.8}));pl.position.set(0.9,0.45+i*0.32,1.1);g.add(pl);}g.userData={w:2.6,d:2.6,top:3.4};return g;}
  function wrap(){const g=new THREE.Group();const p1=box(0.28,2.6,0.28,mDark);p1.position.set(-1.1,1.3,-1.1);g.add(p1);const p2=p1.clone();p2.position.set(1.1,1.3,-1.1);g.add(p2);const bm=box(2.5,0.28,0.28,mDark);bm.position.set(0,2.6,-1.1);g.add(bm);const r=new THREE.Mesh(new THREE.TorusGeometry(1.05,0.12,12,28),mBlue);r.position.y=1.4;g.add(r);const cu=box(1.4,1.5,1.4,new THREE.MeshStandardMaterial({color:0xd7dde6,metalness:0.1,roughness:0.5,transparent:true,opacity:0.85}));cu.position.y=0.95;g.add(cu);g.userData={w:2.4,d:2.4,top:2.8};return g;}
  function cartons(){const g=new THREE.Group();const base=box(2.4,1.6,1.8,mBody);base.position.y=0.8;g.add(base);const win=box(0.6,0.5,0.04,mGlass);win.position.set(0,1.1,0.93);g.add(win);const cartonMat=new THREE.MeshStandardMaterial({color:0xb98a4e,roughness:0.85});for(let i=0;i<5;i++){const c=box(1.0,0.08,1.2,cartonMat);c.position.set(-1.6,0.1+i*0.09,0);g.add(c);}const filmMat=new THREE.MeshStandardMaterial({color:0xd7dde6,metalness:0.1,roughness:0.45,transparent:true,opacity:0.78});for(let i=0;i<2;i++){const p=box(0.9,0.5,0.9,filmMat);p.position.set(1.55,0.3,(i-0.5)*1.0);g.add(p);}const arm=box(0.25,0.25,1.6,mDark);arm.position.set(0,1.85,0);g.add(arm);g.userData={w:2.6,d:2.4,top:1.95};return g;}
  const B={tanks,rinser,filler,tunnel,coder,gantry,pack,pallet,wrap,cartons};

  const cG=new THREE.Color(0x19c37d),cA=new THREE.Color(0xf2a623),cR=new THREE.Color(0xff3b3b);
  function oeeColor(o){const t=Math.max(0,Math.min(1,(o-0.55)/0.4));const c=new THREE.Color();return t<0.5?c.lerpColors(cR,cA,t*2):c.lerpColors(cA,cG,(t-0.5)*2);}

  // Refactor: stack returns refs to its 3 tier materials so we can repaint
  function stack(o){
    const g=new THREE.Group();
    const post=cyl(0.07,0.07,0.55,mDark);post.position.y=0.27;g.add(post);
    const tiers=[
      {y:0.66,col:0xff3b3b},  // red
      {y:0.88,col:0xf2a623},  // amber
      {y:1.10,col:0x19c37d}   // green
    ];
    const refs=tiers.map(t=>{
      const mat=new THREE.MeshStandardMaterial({color:t.col,emissive:t.col,emissiveIntensity:0.04,roughness:0.3,transparent:true,opacity:0.5});
      const c=cyl(0.17,0.17,0.2,mat,16);c.position.y=t.y;g.add(c);
      return mat;
    });
    applyStackOEE(refs,o);
    return {group:g,refs};
  }
  function applyStackOEE(refs,o){
    const red=o<0.68,amb=o>=0.68&&o<0.8,grn=!red&&!amb;
    refs[0].emissiveIntensity=red?1.4:0.04; refs[0].opacity=red?0.95:0.5;
    refs[1].emissiveIntensity=amb?1.4:0.04; refs[1].opacity=amb?0.95:0.5;
    refs[2].emissiveIntensity=grn?1.4:0.04; refs[2].opacity=grn?0.95:0.5;
  }

  function label(text,px){const cv=document.createElement('canvas');cv.width=420;cv.height=110;const x=cv.getContext('2d');x.font='700 '+(px||34)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle='rgba(235,242,250,0.95)';x.fillText(text,210,55);const tex=new THREE.CanvasTexture(cv);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));sp.scale.set(5,1.3,1);return sp;}

  // Per-line label sprite that can be re-painted with the active SKU + format.
  // Two stacked text rows: big SKU on top, small "L## · format · brand" below.
  const lineLabels={};
  function makeLineLabel(lineKey){
    const cv=document.createElement('canvas');cv.width=512;cv.height=192;
    const tex=new THREE.CanvasTexture(cv);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
    sp.scale.set(6.4,2.4,1);
    const state={lastKey:''};
    function repaint(sku,format,brandColor,isIdle){

        }
      } else if(idle){
        cardHlShown[L.id]=null;
      }
    });
  }
  renderCards();

  // ─── Camera + interaction (OrbitControls + cinematic click-to-fly) ───────
  camera.position.set(28,26,32); camera.lookAt(0,2,0);
  let controls=null;
  if(THREE.OrbitControls){
    controls=new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping=true; controls.dampingFactor=0.06;
    controls.minDistance=18; controls.maxDistance=110;
    controls.minPolarAngle=0.18; controls.maxPolarAngle=1.45;
    controls.target.set(0,2,0); controls.update();
  }
  let lastInteractAt=performance.now();
  let cameraFly=null; // {p0,p1,t0,t1,tgt0,tgt1,start,dur}
  function startFly(toPos, toTarget, dur){
    if(!controls)return;
    cameraFly={
      p0:camera.position.clone(), p1:toPos.clone(),
      tgt0:controls.target.clone(), tgt1:toTarget.clone(),
      start:performance.now(), dur:dur||1100
    };
    controls.enabled=false;
  }
  function easeInOutCubic(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
  const ray=new THREE.Raycaster(),mv=new THREE.Vector2(),panel=document.getElementById('panel');let selected=null;

  function show(s){
    selected=s;panel.style.display='block';
    const st=statusOf(s.oee);
    document.getElementById('p-name').textContent=s.name;
    document.getElementById('p-line').textContent='Línea '+s.line;
    const pd=document.getElementById('p-dot'); pd.style.color=st[1]; pd.style.background=st[1];
    document.getElementById('p-oee').textContent=Math.round(s.oee*100)+'%';
    document.getElementById('p-oee').style.color=st[1];
    document.getElementById('p-fail').textContent=s.fail;
    // Current plan block for this line
    const blkRow=document.getElementById('p-block-row');
    const ctx=lastCtx&&lastCtx[s.line];
    if(ctx&&!ctx.idle){
      blkRow.style.display='block';
      const pct=Math.max(0,Math.min(100,Math.round(ctx.progress*100)));
      const fmt=ctx.format?' ('+ctx.format+')':'';
      const turno=ctx.turno?' · turno '+ctx.turno:'';
      const feas=ctx.feasible===false?'<div style="margin-top:3px;color:#fca5a5">⚠ '+(ctx.feasReason||'Bloque infactible')+'</div>':'';
      document.getElementById('p-block').innerHTML=
        '<div><b style="color:#fff">'+ctx.sku+'</b>'+fmt+'</div>'+
        '<div style="color:#8ca0bd">'+(ctx.hl?Math.round(ctx.hl)+' Hl':'')+turno+'</div>'+
        '<div style="margin-top:3px;color:#cbd5e1">'+pct+'% completado del bloque</div>'+feas;
    } else if(ctx&&ctx.idle){
      blkRow.style.display='block';
      document.getElementById('p-block').innerHTML='<div style="color:#8ca0bd">Sin bloque programado</div>';
    } else blkRow.style.display='none';
  }
  function findS(o){while(o){if(o.userData&&o.userData.station)return o.userData.station;o=o.parent;}return null;}
  function findGroup(o){while(o){if(o.userData&&o.userData.station)return o;o=o.parent;}return null;}
  const el=renderer.domElement;
  let _dx0=0,_dy0=0,_moved=0;
  el.addEventListener('pointerdown',e=>{_dx0=e.clientX;_dy0=e.clientY;_moved=0;lastInteractAt=performance.now();if(window.__lwDemo&&window.__lwDemo.active)window.__lwDemo.cancel('user');});
  window.addEventListener('pointermove',e=>{const dx=e.clientX-_dx0,dy=e.clientY-_dy0;_moved=Math.max(_moved,Math.abs(dx)+Math.abs(dy));if(_moved>4)lastInteractAt=performance.now();});
  window.addEventListener('pointerup',e=>{
    if(_moved<6){
      const r=el.getBoundingClientRect();
      mv.x=((e.clientX-r.left)/r.width)*2-1; mv.y=-((e.clientY-r.top)/r.height)*2+1;
      ray.setFromCamera(mv,camera);
      const h=ray.intersectObjects(machineGroups,true)[0];
      if(h){
        const grp=findGroup(h.object); const s=grp&&grp.userData.station;
        if(s){
          show(s);
          // Cinematic fly: position camera at a 3/4 angle around this station
          const tgtPos=new THREE.Vector3(s.x, (s.top||2)*0.5+0.4, grp.userData.lineZ);
          const camPos=new THREE.Vector3(s.x+7.5, (s.top||2)+5.5, grp.userData.lineZ+9);
          startFly(camPos, tgtPos, 1100);
        }
      }
    }
    lastInteractAt=performance.now();
  });

  // ─── Plan simulation ──────────────────────────────────────────────────────
  // Parse plan_data.js into per-line block arrays with epoch-ms timestamps so
  // the scrubber and play loop can work in numeric time.
  const PLAN_LINES={L14:[],L17:[],L19:[]};
  let tMin=0,tMax=0,lastCtx=null;
  let playhead=0; // epoch ms
  let playing=false;
  let speed=4; // multiplier on simSecondsPerTick

  if(P&&P.lines){
    Object.keys(PLAN_LINES).forEach(k=>{
      const blocks=(P.lines[k]&&P.lines[k].blocks)||[];
      PLAN_LINES[k]=blocks.map(b=>({
        blockId:b.blockId, sku:b.sku, format:b.format, hl:b.hl, turno:b.turno,
        brand:b.brand||null, brandColor:b.brandColor||'#94a3b8',
        changeoverType:b.changeoverType||null,
        changeoverStations:Array.isArray(b.changeoverStations)?b.changeoverStations:[],
        oee:typeof b.oee==='number'?b.oee:0.7,
        feasible:b.feasible!==false,
        feasReason:b.feasReason||null,
        start:new Date(b.startIso).getTime(),
        end:new Date(b.endIso).getTime(),
      })).filter(b=>!isNaN(b.start)&&!isNaN(b.end)&&b.end>b.start)
        .sort((a,b)=>a.start-b.start);
    });
    tMin=P.meta&&P.meta.tMinIso?new Date(P.meta.tMinIso).getTime():
      Math.min.apply(null,[].concat.apply([],Object.values(PLAN_LINES).map(arr=>arr.map(b=>b.start))));
    tMax=P.meta&&P.meta.tMaxIso?new Date(P.meta.tMaxIso).getTime():
      Math.max.apply(null,[].concat.apply([],Object.values(PLAN_LINES).map(arr=>arr.map(b=>b.end))));
    playhead=tMin;
  }

  const SIM_SEC_PER_TICK=(P&&P.meta&&P.meta.simSecondsPerTick)||1975;

  function activeBlock(blocks,t){
    for(let i=0;i<blocks.length;i++){
      if(t>=blocks[i].start&&t<blocks[i].end)return blocks[i];
    }
    return null;
  }

  function formatTime(t){
    const d=new Date(t);
    const dd=String(d.getDate()).padStart(2,'0');
    const months=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const mon=months[d.getMonth()];
    const hh=String(d.getHours()).padStart(2,'0');
    const mm=String(d.getMinutes()).padStart(2,'0');
    return dd+' '+mon+' '+hh+':'+mm;
  }

  // Per-line bookkeeping for transitions and station flashes.
  const lastBlockId={L14:null,L17:null,L19:null};
  const flashState={}; // key "L14|cod" → epoch ms when the flash expires
  const FLASH_DUR_MS=3000;
  const FLASH_COLOR=new THREE.Color(0xfde047);

  function triggerFlash(lineKey,stations){
    const exp=performance.now()+FLASH_DUR_MS;
    (stations||[]).forEach(stk=>{
      flashState[lineKey+'|'+stk]=exp;
      const s=stationByLine[lineKey]&&stationByLine[lineKey][stk];
      if(s) spawnSparks(lineKey, s.x, Z_BY_LINE[lineKey], (s.top||1)+0.4);
    });
  }

  function applyPlanTime(t){
    playhead=Math.max(tMin,Math.min(tMax,t));
    const ctx={};
    LINES.forEach(L=>{
      const blocks=PLAN_LINES[L.id]||[];
      const blk=activeBlock(blocks,playhead);
      if(blk){
        setLineOEE(L.id,blk.oee);
        setLineCanColor(L.id,blk.brandColor,1.0);
        lineSpeedMult[L.id]=0.4+blk.oee*1.0;
        lineLabels[L.id]&&lineLabels[L.id].repaint(blk.sku,blk.format,blk.brandColor,false);
        if(lineGlow[L.id]){
          lineGlow[L.id].activeColor.setStyle(blk.brandColor||'#94a3b8');
          lineGlow[L.id].isActive=true;
        }
        const dur=blk.end-blk.start;
        ctx[L.id]={
          oee:blk.oee, sku:blk.sku, format:blk.format, brand:blk.brand,
          brandColor:blk.brandColor, hl:blk.hl, turno:blk.turno,
          feasible:blk.feasible, feasReason:blk.feasReason,
          progress:dur>0?(playhead-blk.start)/dur:0,
          idle:false,
        };
        // Trigger a flash on station(s) responsible for this changeover when
        // the active block id flips compared to the last frame.
        if(lastBlockId[L.id]!==blk.blockId){
          if(lastBlockId[L.id]!==null&&blk.changeoverStations.length){
            triggerFlash(L.id,blk.changeoverStations);
          }
          lastBlockId[L.id]=blk.blockId;
        }
      } else {
        setLineOEE(L.id,L.baseOee);
        setLineCanColor(L.id,'#6b7280',0.35);
        lineSpeedMult[L.id]=0;
        lineLabels[L.id]&&lineLabels[L.id].repaint(null,null,null,true);
        lastBlockId[L.id]=null;
        if(lineGlow[L.id]){lineGlow[L.id].activeColor.setStyle('#6b7280');lineGlow[L.id].isActive=false;}
        ctx[L.id]={oee:L.baseOee,idle:true};
      }
    });
    lastCtx=ctx;
    document.getElementById('sim-time').textContent=formatTime(playhead);
    document.getElementById('sim-scrubber').value=playhead;
    renderCards(ctx);
    // refresh the open detail panel so the block info stays in sync
    if(selected)show(selected);
  }

  function setPlaying(on){
    playing=on;
    document.getElementById('sim-play').textContent=on?'■':'▶';
  }

  const scrubber=document.getElementById('sim-scrubber');
  const speedSel=document.getElementById('sim-speed');
  if(P&&tMax>tMin){
    scrubber.min=tMin; scrubber.max=tMax; scrubber.value=tMin;
    document.getElementById('subtitle').textContent=
      'Simulación del plan semanal · '+P.meta.weekStart+' → '+P.meta.weekEnd+' · L14 · L17 · L19';
    applyPlanTime(tMin);
  } else {
    document.getElementById('overlay-sim').style.opacity='0.5';
    document.getElementById('sim-play').disabled=true;
    document.getElementById('sim-time').textContent='sin plan_data.js';
  }

  document.getElementById('sim-play').addEventListener('click',()=>setPlaying(!playing));
  document.getElementById('sim-prev').addEventListener('click',()=>{setPlaying(false);applyPlanTime(playhead-3600*1000);});
  document.getElementById('sim-next').addEventListener('click',()=>{setPlaying(false);applyPlanTime(playhead+3600*1000);});
  scrubber.addEventListener('input',e=>{setPlaying(false);applyPlanTime(parseFloat(e.target.value));});
  speedSel.addEventListener('change',e=>{speed=parseFloat(e.target.value)||1;});

  // ─── Demo autopilot ───────────────────────────────────────────────────────
  const demoBtn=document.getElementById('sim-demo');
  function buildDemoEvents(){
    const events=[];
    Object.keys(PLAN_LINES).forEach(lk=>{
      (PLAN_LINES[lk]||[]).forEach(b=>{
        if(b.changeoverType && b.changeoverStations && b.changeoverStations.length){
          events.push({epoch:b.start, line:lk, station:b.changeoverStations[0], sku:b.sku, brand:b.brand});
        }
      });
    });
    events.sort((a,b)=>a.epoch-b.epoch);
    return events;
  }
  const demoState={
    active:false, events:[], idx:0, nextPanAt:0, prevSpeed:4,
    holdUntil:0, panLine:0,
    start(){
      if(!P||tMax<=tMin)return;
      this.active=true; this.events=buildDemoEvents(); this.idx=0;
      this.prevSpeed=speed;
      speed=8; speedSel.value='8';
      applyPlanTime(tMin);
      setPlaying(true);
      // wide establishing shot
      startFly(new THREE.Vector3(0,28,46), new THREE.Vector3(0,2,0), 1400);
      this.nextPanAt=performance.now()+9000;
      this.holdUntil=0;
      demoBtn.classList.add('lw-active');
      demoBtn.textContent='■ Demo';
    },
    cancel(reason){
      if(!this.active)return;
      this.active=false;
      setPlaying(false);
      speed=this.prevSpeed; speedSel.value=String(this.prevSpeed);
      demoBtn.classList.remove('lw-active');
      demoBtn.textContent='▷ Demo';
    },
    tick(nowMs){
      if(!this.active)return;
      // hold paused while a station is being inspected
      if(this.holdUntil>0){
        if(nowMs>=this.holdUntil){
          this.holdUntil=0;
          setPlaying(true);
          // resume by flying back to a 3/4 overview
          startFly(new THREE.Vector3(0,26,40), new THREE.Vector3(0,2,0), 1100);
        }
        return;
      }
      // check next changeover event
      while(this.idx<this.events.length && this.events[this.idx].epoch<=playhead+500){
        const ev=this.events[this.idx]; this.idx++;
        const s=stationByLine[ev.line]&&stationByLine[ev.line][ev.station];
        if(!s)continue;
        setPlaying(false);
        show(s);
        const tgtP=new THREE.Vector3(s.x,(s.top||2)*0.5+0.4, Z_BY_LINE[ev.line]);
        const camP=new THREE.Vector3(s.x+6.5,(s.top||2)+4.5, Z_BY_LINE[ev.line]+8);
        startFly(camP, tgtP, 950);
        this.holdUntil=nowMs+2400;
        return;
      }
      // end of demo
      if(playhead>=tMax-1000){
        this.cancel('end');
        return;
      }
      // periodic lateral pan to keep camera alive
      if(nowMs>=this.nextPanAt && !cameraFly){
        const lines=['L19','L17','L14'];
        this.panLine=(this.panLine+1)%lines.length;
        const z=Z_BY_LINE[lines[this.panLine]];
        startFly(new THREE.Vector3(2, 18, z+24), new THREE.Vector3(0,2,z), 1700);
        this.nextPanAt=nowMs+11000;
      }
    }
  };
  window.__lwDemo=demoState;
  demoBtn.addEventListener('click',()=>{
    if(demoState.active) demoState.cancel('user');
    else demoState.start();
  });

  // ─── Animation loop ───────────────────────────────────────────────────────
  let tm=0; const tickDt=0.025;
  function loop(){requestAnimationFrame(loop);tm+=tickDt;
    if(playing&&tMax>tMin){
      const next=playhead+SIM_SEC_PER_TICK*1000*speed;
      if(next>=tMax){applyPlanTime(tMax);setPlaying(false);}
      else applyPlanTime(next);
    }
    // cans + belt scroll
    cans.forEach(c=>{
      const mult=lineSpeedMult[c.userData.lineKey]||0;
      c.userData.d+=0.07*mult;
      if(c.userData.d>L_total)c.userData.d-=L_total;
      c.position.x=X0+c.userData.d;
    });
    Object.keys(beltMat).forEach(lk=>{const t=beltMat[lk].map; if(t){t.offset.x-=0.006*(lineSpeedMult[lk]||0);}});

    // brand floor stripe: lerp + pulse
    Object.keys(lineGlow).forEach(lk=>{
      const lg=lineGlow[lk];
      lg.mat.color.lerp(lg.activeColor, 0.08);
      if(lg.isActive){lg.mat.opacity=0.42+0.13*Math.sin(tm*1.8 + (lk==='L14'?0:lk==='L17'?2.1:4.2));}
      else {lg.mat.opacity=0.08;}
    });

    // pad pulsing + per-station changeover flash overlay
    const nowMs=performance.now();
    Object.keys(stationByLine).forEach(lineKey=>{
      const line=stationByLine[lineKey];
      Object.keys(line).forEach(stk=>{
        const s=line[stk];
        const pl=0.7+0.3*Math.sin(tm*2.4);
        const flashExp=flashState[lineKey+'|'+stk];
        if(flashExp){
          if(nowMs<flashExp){
            const pulse=0.7+0.3*Math.abs(Math.sin(tm*8.0));
            s.pad.material.color.copy(FLASH_COLOR);
            s.pad.material.opacity=Math.min(0.95,0.55+0.4*pulse);
          } else {
            delete flashState[lineKey+'|'+stk];
            recolorStation(s,s.oee);
          }
        } else {
          s.pad.material.opacity=(s===selected)?Math.min(0.95,s.padBase+0.3+0.18*pl):s.padBase;
        }
      });
    });

    // particles (steam + sparks)
    const dt=tickDt;
    Object.keys(steamSystems).forEach(lk=>{
      const sys=steamSystems[lk]; const active=(lineSpeedMult[lk]||0)>0.01;
      for(let i=0;i<sys.N;i++){
        sys.age[i]+=dt*1.1;
        if(sys.age[i]>=sys.maxAge[i]){
          if(active){
            const sp=sys.spawnPos[i%sys.spawnPos.length];
            sys.positions[i*3]=sp.x+(Math.random()-0.5)*0.55;
            sys.positions[i*3+1]=sp.y;
            sys.positions[i*3+2]=sp.z+(Math.random()-0.5)*0.55;
            sys.vel[i]={x:(Math.random()-0.5)*0.45, y:0.45+Math.random()*0.35, z:(Math.random()-0.5)*0.45};
            sys.age[i]=0;
            sys.maxAge[i]=1.4+Math.random()*1.1;
          } else {
            sys.colors[i*3]=0;sys.colors[i*3+1]=0;sys.colors[i*3+2]=0; continue;
          }
        }
        sys.positions[i*3]+=sys.vel[i].x*dt;
        sys.positions[i*3+1]+=sys.vel[i].y*dt;
        sys.positions[i*3+2]+=sys.vel[i].z*dt;
        const fade=Math.max(0,1-sys.age[i]/sys.maxAge[i]);
        const f=fade*fade*0.85;
        sys.colors[i*3]=0.78*f; sys.colors[i*3+1]=0.86*f; sys.colors[i*3+2]=f;
      }
      sys.pts.geometry.attributes.position.needsUpdate=true;
      sys.pts.geometry.attributes.color.needsUpdate=true;
    });
    Object.keys(sparkSystems).forEach(lk=>{
      const sys=sparkSystems[lk];
      for(let i=0;i<sys.N;i++){
        if(sys.age[i]>=sys.maxAge){sys.colors[i*3]=0;sys.colors[i*3+1]=0;sys.colors[i*3+2]=0;continue;}
        sys.age[i]+=dt;
        sys.positions[i*3]+=sys.vel[i].x*dt;
        sys.positions[i*3+1]+=sys.vel[i].y*dt;
        sys.positions[i*3+2]+=sys.vel[i].z*dt;
        sys.vel[i].y-=4.2*dt;
        const fade=Math.max(0,1-sys.age[i]/sys.maxAge);
        sys.colors[i*3]=fade; sys.colors[i*3+1]=0.92*fade; sys.colors[i*3+2]=0.3*fade;
      }
      sys.pts.geometry.attributes.position.needsUpdate=true;
      sys.pts.geometry.attributes.color.needsUpdate=true;
    });

    // workers + forklift
    workers.forEach(w=>{const sw=Math.sin(tm*6+w.userData.ph);if(w.userData.la){w.userData.la.rotation.x=sw*0.5;w.userData.ra.rotation.x=-sw*0.5;}if(!w.userData.static){w.position.x+=w.userData.dir*w.userData.spd;if(w.userData.legs)w.userData.legs.position.y=0.35+Math.abs(sw)*0.04;if(w.position.x>29){w.position.x=-29;}if(w.position.x<-29){w.position.x=29;}}});
    fk.userData.d+=0.05;const fd=fk.userData.d%80;let fx,fz,fr;if(fd<20){fx=-27+fd*1.35;fz=19;fr=1.5708;}else if(fd<40){fx=0;fz=19-(fd-20)*1.0;fr=3.14;}else if(fd<60){fx=(fd-40)*1.35;fz=-1;fr=-1.5708;}else{fx=27;fz=-1+(fd-60)*1.0;fr=0;}fk.position.set(Math.max(-28,Math.min(28,fx)),0,Math.max(-20,Math.min(20,fz)));fk.rotation.y=fr;

    // camera fly tween
    if(cameraFly){
      const u=Math.min(1,(nowMs-cameraFly.start)/cameraFly.dur);
      const e=easeInOutCubic(u);
      camera.position.lerpVectors(cameraFly.p0, cameraFly.p1, e);
      if(controls){controls.target.lerpVectors(cameraFly.tgt0, cameraFly.tgt1, e); controls.update();}
      else camera.lookAt(cameraFly.tgt0.clone().lerp(cameraFly.tgt1,e));
      if(u>=1){cameraFly=null; if(controls)controls.enabled=true;}
    } else if(controls){
      // idle auto-drift azimuth
      const idleFor=nowMs-lastInteractAt;
      if(idleFor>6000 && !(window.__lwDemo&&window.__lwDemo.active)){
        const o=controls.target;
        const off=new THREE.Vector3().subVectors(camera.position,o);
        const sph=new THREE.Spherical().setFromVector3(off);
        sph.theta-=0.0008;
        off.setFromSpherical(sph);
        camera.position.copy(o).add(off);
      }
      controls.update();
    }

    // demo autopilot tick
    if(window.__lwDemo&&window.__lwDemo.active){window.__lwDemo.tick(nowMs);}

    if(composer)composer.render(); else renderer.render(scene,camera);
  }
  loop();
  window.addEventListener('resize',()=>{
    camera.aspect=W()/H();camera.updateProjectionMatrix();renderer.setSize(W(),H());
    if(composer)composer.setSize(W(),H());
    if(bloomPass)bloomPass.setSize(W(),H());
    if(fxaaPass)fxaaPass.material.uniforms.resolution.value.set(1/(W()*renderer.getPixelRatio()),1/(H()*renderer.getPixelRatio()));
  });
})();
</script>
